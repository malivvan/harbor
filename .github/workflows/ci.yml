name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -count=1 -timeout 180s ./...

      - name: test -race
        run: go test -race -count=1 -timeout 300s ./...

      - name: coverage
        run: go test -count=1 -timeout 180s -covermode=atomic -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out > coverage.txt
